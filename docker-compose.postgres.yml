services:
  postgres:
    image: postgres:16
    container_name: flowtracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flowdb
    ports:
      - "5433:5432"
    volumes:
      - /Volumes/SD3.2_256/db/flowtracker-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow -d flowdb"]
      interval: 5s
      timeout: 5s
      retries: 20
